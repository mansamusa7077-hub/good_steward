name: Cyber Agents CI

on:
  push:
    branches: [main]
    paths:
      - "apps/cyber-agents/**"
      - "package.json"
      - ".github/workflows/cyber-agents-ci.yml"
  pull_request:
    paths:
      - "apps/cyber-agents/**"
      - "package.json"
      - ".github/workflows/cyber-agents-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build workspaces
        run: npm run build
      - name: Run tests
        run: npm test
